name: Byg KD Mail

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  schedule:
    # Hver mandag: byg igen, så nye Thunderbird-sikkerhedsopdateringer kommer med
    - cron: "17 5 * * 1"

permissions:
  contents: write

jobs:
  windows-linux:
    name: Windows og Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Værktøjer
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nsis p7zip-full rpm zip python3-pil

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Byg installationsfiler
        run: bash build.sh linux win

      - uses: actions/upload-artifact@v7
        with:
          name: KD-Mail-Windows-Linux
          path: dist/*

      - name: Udgiv (ved tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*

  mac:
    name: macOS
    # Signeres og pakkes på en rigtig Mac med Apples egne værktøjer
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Værktøjer
        run: python -m pip install --quiet pillow

      - name: Byg installationsfiler
        run: bash build.sh mac

      - uses: actions/upload-artifact@v7
        with:
          name: KD-Mail-macOS
          path: dist/*

      - name: Udgiv (ved tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
